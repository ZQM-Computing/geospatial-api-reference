name: Supply Chain Security Scan
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: "0 0 * * 1"

permissions:
  contents: read
  security-events: write
  issues: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Run vendored MIT-licensed supply-chain scanner
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python .github/scripts/snyk_replacement.py \
            --repo "${{ github.repository }}" \
            --root "." \
            --output both \
            --pr "${{ github.event.pull_request.number || 0 }}"
      - name: Locate SARIF report
        id: sarif
        if: always()
        shell: bash
        run: |
          if [ -d .zqm-security-reports ]; then
            report="$(find .zqm-security-reports -type f -name '*-results.sarif' -print -quit)"
          else
            report=""
          fi
          echo "path=$report" >> "$GITHUB_OUTPUT"
      - name: Upload SARIF (best-effort when code scanning is unavailable)
        if: always() && steps.sarif.outputs.path != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ steps.sarif.outputs.path }}
      - name: Upload scan reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: supply-chain-scan-${{ github.run_id }}
          path: .zqm-security-reports/
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 30
