name: fulfill

on:
  issues:
    types: [opened, labeled]
  issue_comment:
    types: [created]

jobs:
  fulfill:
    if: |
      (github.event_name == 'issues' && (contains(github.event.issue.labels.*.name, 'purchase') || contains(github.event.issue.labels.*.name, 'subscription'))) ||
      (github.event_name == 'issue_comment' && (contains(github.event.issue.labels.*.name, 'purchase') || contains(github.event.issue.labels.*.name, 'subscription')) && !contains(github.event.issue.labels.*.name, 'fulfilled'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install toolchain
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt || true
          pip install -e . || true
      - name: Check secrets
        run: |
          if [ -z "${{ secrets.SMTP_HOST }}" ] || [ -z "${{ secrets.SMTP_USER }}" ] || [ -z "${{ secrets.SMTP_PASS }}" ] || [ -z "${{ secrets.EMAIL_FROM }}" ]; then
            echo "::error::Missing required SMTP/email secrets"
            exit 1
          fi
      - name: Run fulfillment bot
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          RELEASE_URL: https://github.com/${{ github.repository }}/releases/latest/download/zqm_attestation_release_package.zip
          EXPECTED_HASH: ${{ secrets.EXPECTED_HASH }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          PAYMENT_RAIL_BTC: ${{ secrets.PAYMENT_RAIL_BTC }}
          PAYMENT_RAIL_ETH: ${{ secrets.PAYMENT_RAIL_ETH }}
          PAYMENT_RAIL_SOL: ${{ secrets.PAYMENT_RAIL_SOL }}
          PAYMENT_RAIL_DOGE: ${{ secrets.PAYMENT_RAIL_DOGE }}
          PAYMENT_RAIL_LTC: ${{ secrets.PAYMENT_RAIL_LTC }}
          PAYMENT_RAIL_XMR: ${{ secrets.PAYMENT_RAIL_XMR }}
        run: |
          set -o pipefail
          python scripts/fulfill_bot.py || { echo '::error::Fulfillment bot failed'; exit 1; }
      - name: Label fulfilled
        if: success()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -sS -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/issues/${{ github.event.issue.number }}/labels" \
            -d '{"labels":["fulfilled"]}'
