[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "geospatial-api-reference"
version = "1.0.0"
description = "Reference implementation of OGC API - Features with FastAPI and PostGIS"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

[tool.pytest.ini_options]
# Make the repo root importable so tests can `import app` from anywhere.
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]
