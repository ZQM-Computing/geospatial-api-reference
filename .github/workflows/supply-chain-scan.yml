name: Supply Chain Security Scan

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: "0 0 * * 1"

permissions:
  contents: read

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        if: hashFiles('requirements.txt') != '' || hashFiles('pyproject.toml') != ''
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pip-audit
        if: hashFiles('requirements.txt') != '' || hashFiles('pyproject.toml') != ''
        run: python -m pip install --upgrade pip pip-audit

      - name: Audit requirements.txt dependencies
        if: hashFiles('requirements.txt') != ''
        run: pip-audit -r requirements.txt

      - name: Audit pyproject dependencies when no requirements file exists
        if: hashFiles('requirements.txt') == '' && hashFiles('pyproject.toml') != ''
        run: pip-audit .

      - name: Report that no Python dependency manifest exists
        if: hashFiles('requirements.txt') == '' && hashFiles('pyproject.toml') == ''
        run: echo "::notice::No supported Python dependency manifest was found. This run does not claim to audit runtime dependencies; GitHub Actions dependencies are handled by Dependabot."
