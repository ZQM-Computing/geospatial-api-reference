name: ci
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: echo 'No tests configured yet.'
  ci:
    name: ci
    needs: [validate]
    runs-on: ubuntu-latest
    steps:
      - run: echo "validation passed"
