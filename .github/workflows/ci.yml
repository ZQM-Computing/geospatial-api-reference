name: CI

"on":
  push:
    branches: [ main, master ]
    paths-ignore:
      - '**.md'
      - '**.png'
      - '**.jpg'
      - '**.gif'
  pull_request:
    branches: [ main, master ]
    paths-ignore:
      - '**.md'
      - '**.png'
      - '**.jpg'
      - '**.gif'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  detect:
    runs-on: self-hosted
    outputs:
      python: ${{ steps.detect.outputs.python }}
      node: ${{ steps.detect.outputs.node }}
      go: ${{ steps.detect.outputs.go }}
    steps:
      - uses: actions/checkout@v4
      - id: detect
        run: |
          if [ -f pyproject.toml ] || [ -f pytest.ini ] || [ -f requirements.txt ] || [ -d tests ]; then
            echo "python=true" >> "$GITHUB_OUTPUT"
          else
            echo "python=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -f package.json ]; then
            echo "node=true" >> "$GITHUB_OUTPUT"
          else
            echo "node=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -f go.mod ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "go=false" >> "$GITHUB_OUTPUT"
          fi

  python:
    needs: detect
    if: needs.detect.outputs.python == 'true'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install and test
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then python -m pip install -r requirements.txt; fi
          if [ -f pyproject.toml ] || [ -f setup.py ]; then python -m pip install -e .; fi
          python -m pip install pytest
          if find . -path './.git' -prune -o -type f \( -name 'test_*.py' -o -name '*_test.py' \) -print -quit | grep -q .; then
            python -m pytest -q
          else
            echo "No pytest-discoverable test files; dependency installation completed."
          fi

  node:
    needs: detect
    if: needs.detect.outputs.node == 'true'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install and test
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          if node -e "process.exit(require('./package.json').scripts?.test ? 0 : 1)"; then
            npm test
          else
            echo "No npm test script configured; dependency installation completed."
          fi

  go:
    needs: detect
    if: needs.detect.outputs.go == 'true'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true
      - name: Run tests
        run: go test ./...

  docs:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check repository documentation
        run: python scripts/check_docs.py
