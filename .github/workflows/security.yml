name: Security Scan
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
permissions:
  contents: read
jobs:
  gitleaks:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: stable
      - name: Install Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          # Build into a per-job directory: every self-hosted runner on this host
          # shares one $GOPATH/bin, so a shared install races with concurrent jobs
          # and fails with "Device or resource busy" (exit 126).
          GOBIN="$RUNNER_TEMP/gitleaks-bin"
          export GOBIN
          mkdir -p "$GOBIN"
          go install github.com/zricethezav/gitleaks/v8@v8.25.0
          echo "$GOBIN" >> "$GITHUB_PATH"
      - name: Scan full repository history
        shell: bash
        run: |
          if [ -f .gitleaks.toml ]; then
            gitleaks git --config .gitleaks.toml --redact .
          else
            gitleaks git --redact .
          fi
