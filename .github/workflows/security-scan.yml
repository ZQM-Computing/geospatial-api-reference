name: CodeQL

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: "0 0 * * 0"

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  detect:
    runs-on: self-hosted
    outputs:
      languages: ${{ steps.detect.outputs.languages }}
      has_code: ${{ steps.detect.outputs.has_code }}
    steps:
      - uses: actions/checkout@v4
      - id: detect
        shell: bash
        run: |
          languages=()
          add_language() { languages+=("$1"); }
          find . -path './.git' -prune -o -type f -name '*.py' -print -quit | grep -q . && add_language python || true
          find . -path './.git' -prune -o -type f \( -name '*.js' -o -name '*.jsx' -o -name '*.ts' -o -name '*.tsx' \) -print -quit | grep -q . && add_language javascript-typescript || true
          find . -path './.git' -prune -o -type f -name '*.go' -print -quit | grep -q . && add_language go || true
          find . -path './.git' -prune -o -type f \( -name '*.java' -o -name '*.kt' \) -print -quit | grep -q . && add_language java-kotlin || true
          find . -path './.git' -prune -o -type f -name '*.cs' -print -quit | grep -q . && add_language csharp || true
          find . -path './.git' -prune -o -type f \( -name '*.c' -o -name '*.h' -o -name '*.cpp' -o -name '*.hpp' \) -print -quit | grep -q . && add_language c-cpp || true
          if [ "${#languages[@]}" -eq 0 ]; then
            echo "has_code=false" >> "$GITHUB_OUTPUT"
            echo "No supported CodeQL source language found."
          else
            joined="$(IFS=,; echo "${languages[*]}")"
            echo "languages=$joined" >> "$GITHUB_OUTPUT"
            echo "has_code=true" >> "$GITHUB_OUTPUT"
            echo "CodeQL languages: $joined"
          fi
  analyze:
    needs: detect
    if: needs.detect.outputs.has_code == 'true'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ needs.detect.outputs.languages }}
      - uses: github/codeql-action/analyze@v4
        with:
          upload: false
          output: codeql-results
      - name: Preserve CodeQL results as a workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codeql-results-${{ github.run_id }}
          path: codeql-results
          if-no-files-found: warn
          retention-days: 30
