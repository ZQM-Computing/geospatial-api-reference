name: Gitleaks Secret Scan

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: "0 4 * * 1"

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - name: Install Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          # Build into a per-job directory: every self-hosted runner on this host
          # shares one $GOPATH/bin, so a shared install races with concurrent jobs
          # and fails with "Device or resource busy" (exit 126).
          GOBIN="$RUNNER_TEMP/gitleaks-bin"
          export GOBIN
          mkdir -p "$GOBIN"
          go install github.com/zricethezav/gitleaks/v8@v8.25.0
          echo "$GOBIN" >> "$GITHUB_PATH"
      - name: Scan full repository history
        shell: bash
        run: |
          if [ -f .gitleaks.toml ]; then
            gitleaks git --config .gitleaks.toml --redact .
          else
            gitleaks git --redact .
          fi
