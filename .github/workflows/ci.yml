name: CI

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - '**.png'
      - '**.jpg'
      - '**.gif'
      - 'Media/**'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - '**.png'
      - '**.jpg'
      - '**.gif'
      - 'Media/**'
  # Allow manual trigger for full checks
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # Full history for changelog
      
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install ruff
        run: pip install ruff==0.16.4
      
      - name: Run ruff format check
        run: ruff format --check .
      
      - name: Run ruff lint
        run: ruff check .
      
      - name: Upload lint results
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: lint-results
          path: |
            *.py
            Tools/**/*.py

  test:
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v5
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .
      
      - name: Run tests
        run: |
          pytest tests/ -v --tb=short --durations=0
      
      - name: Coverage report
        if: matrix.python-version == '3.11'
        run: |
          pytest --cov=volusia_data --cov-report=xml --cov-report=term-missing
      
      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.11' && success()
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5
      
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Build wheel
        run: |
          pip install build
          python -m build --wheel --outdir dist/
      
      - name: Verify package
        run: |
          pip install dist/*.whl --force-reinstall
          python -c "import volusia_data; print(f'Package OK: {volusia_data.__version__}')"
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: dist-packages
          path: dist/
          retention-days: 90

  integration:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # Full history for changelog
      
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .
      
      - name: Run integration tests
        run: |
          pytest tests/test_integration.py -v --tb=short
      
      - name: Seed database via pipeline
        run: |
          # Keyless fetchers (census_pep, noaa) populate the DB and record a
          # fetch_manifest run so the systems integration check has state to
          # verify. Missing API keys are skips, not failures.
          python Tools/volusia_data/refresh_v2.py

      - name: Systems integration check
        run: |
          python Tools/volusia_data/systems_integration.py --check-all

  security:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v5
      
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install security tools
        run: |
          python -m pip install --upgrade pip
          pip install bandit safety
      
      - name: Run bandit security scan
        run: |
          bandit -r Tools/volusia_data/ -f json -o bandit-report.json || true
          # Fail only on HIGH severity; medium/low findings are reported in
          # the log and the uploaded artifact but are advisory legacy debt.
          bandit -r Tools/volusia_data/ -lll -f screen
      
      - name: Check for known vulnerabilities
        run: |
          pip install -r requirements-dev.txt
          safety check || true
      
      - name: Upload security report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: security-scan-results
          path: bandit-report.json
          retention-days: 30
