name: Supply Chain Security Scan
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    - cron: '0 0 * * 1'

permissions:
  contents: read
  security-events: write
  issues: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Run supply chain scan (vendored stdlib script)
        run: |
          python .github/scripts/snyk_replacement.py \
            --repo ${{ github.repository }} \
            --output both \
            --pr ${{ github.event.pull_request.number || 0 }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload SARIF (best-effort; needs GHAS on private repos)
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        continue-on-error: true
        with:
          sarif_file: .zqm-security-reports/
      - name: Upload findings artifact
        uses: actions/upload-artifact@v7
        with:
          name: supply-chain-scan-${{ github.run_id }}
          path: .zqm-security-reports/
          retention-days: 30
        if: always()