services:
  db:
    image: postgis/postgis:16-3.4-alpine
    environment:
      POSTGRES_DB: geoapi
      POSTGRES_USER: geoapi
      # Disposable local demo only: trust authentication inside the
      # container, host port bound to localhost. Never expose this setup
      # or reuse it for a shared or production database.
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:${GEOAPI_DB_PORT:-54329}:5432"
    volumes:
      - geoapi_data:/var/lib/postgresql/data
      # Runs once, on first database initialization.
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/10_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geoapi -d geoapi"]
      interval: 2s
      timeout: 2s
      retries: 15

  api:
    build: .
    environment:
      GEOAPI_DATA_BACKEND: postgis
      GEOAPI_DATABASE_URL: postgresql://geoapi@db:5432/geoapi
    ports:
      - "127.0.0.1:${GEOAPI_PORT:-8000}:8000"
    depends_on:
      - db

volumes:
  geoapi_data:
